services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: petidentity_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: petidentity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - petidentity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d petidentity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: petidentity_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - petidentity_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  petidentity_pgdata:
  petidentity_redisdata:
